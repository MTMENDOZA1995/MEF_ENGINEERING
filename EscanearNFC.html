<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESCANEAR NFC | MEF Engineering & Soluciones</title>

    <!-- FUENTES E ICONOS DE GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO MEF ENGINEERING (COMPACTO)
           ========================================== */
        :root {
            --primary-color: #1d3b20;
            --primary-hover: #0a1f0d;
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-dark: #202223;
            --text-subdued: #6d7175;
            --border: #c9cccf;
            --interactive: #2c6ecb;
            --critical: #d82c0d;
            --warning: #b98900;
            --success: #108043;
            --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* LAYOUT FIJO: El body no hace scroll global */
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            height: 100svh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* =====================================================
           CONTENEDOR GLOBAL (TARJETA FIJA Y REDUCIDA)
        ===================================================== */
        .container {
            width: 100%;
            max-width: 380px; 
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 700px;
        }

        /* =====================================================
           ENCABEZADO FIJO (SOLO RETORNO A LA DERECHA)
        ===================================================== */
        .card-header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        .card-header .spacer {
            width: 32px; /* Espaciador invisible para centrar el título */
        }

        .card-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            text-align: center;
            flex-grow: 1;
            text-transform: uppercase;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: none;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .icon-btn .material-icons-outlined { font-size: 20px; }

        /* =====================================================
           CONTENEDOR DE OPCIONES (SCROLL INTERNO)
        ===================================================== */
        .planes-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 30px 20px;
            overflow-y: auto;
            flex-grow: 1;
            background-color: var(--bg-color);
        }
        .planes-section::-webkit-scrollbar { width: 0px; background: transparent; }

        /* =====================================================
           DISEÑO ATRACTIVO DE TARJETAS (OPCIONES DE CANJE)
        ===================================================== */
        .card-membresia {
            background: var(--surface);
            padding: 20px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        .card-membresia:active { transform: scale(0.96); }

        /* Borde superior dinámico */
        .card-membresia::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: var(--border);
            transition: all 0.2s ease;
        }

        /* Hover general */
        .card-membresia:hover {
            box-shadow: 0 8px 16px rgba(29, 59, 32, 0.1);
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }
        
        .card-membresia.creditos:hover::before { background: var(--interactive); }
        .card-membresia.ecopoints:hover::before { background: var(--success); }
        .card-membresia.creditos:hover { border-color: var(--interactive); }
        .card-membresia.ecopoints:hover { border-color: var(--success); }

        /* CONTENEDOR DE ICONOS NATIVOS */
        .img-container {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background-color: #f8fafc; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            margin-left: 6px;
        }

        .material-icon-big {
            font-size: 32px;
            color: var(--text-subdued);
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        .card-membresia:hover .material-icon-big { transform: scale(1.15); }
        .card-membresia.creditos:hover .material-icon-big { color: var(--interactive); }
        .card-membresia.ecopoints:hover .material-icon-big { color: var(--success); }

        /* TEXTOS */
        .info-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        .card-membresia h2 {
            font-size: 14px;
            margin: 0 0 4px 0;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        
        .card-membresia.creditos:hover h2 { color: var(--interactive); }
        .card-membresia.ecopoints:hover h2 { color: var(--success); }

        .card-membresia p {
            font-size: 12px;
            margin: 0;
            color: var(--text-subdued);
            line-height: 1.3;
        }

        .chevron-icon {
            color: var(--border);
            font-size: 24px;
            transition: all 0.2s;
        }
        .card-membresia:hover .chevron-icon { transform: translateX(3px); }
        .card-membresia.creditos:hover .chevron-icon { color: var(--interactive); }
        .card-membresia.ecopoints:hover .chevron-icon { color: var(--success); }

        /* =====================================================
           PIE DE PÁGINA ESTÁTICO
        ===================================================== */
        .card-footer {
            background-color: var(--surface);
            text-align: center;
            padding: 10px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-footer .logo { 
            height: 25px; 
            width: auto; 
            display: block; 
            opacity: 0.8;
            pointer-events: none; /* Inactivo */
        }

        /* =====================================================
           SISTEMA DE MODALES Y ALERTAS PRO
        ===================================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards;
            padding: 15px;
        }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 320px; border-radius: var(--radius); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards; text-align: center;
        }
        .modal-header { padding: 20px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; text-transform: uppercase;}
        .modal-body { padding: 5px 20px 20px; color: var(--text-dark); font-size: 13px; line-height: 1.4; }
        .modal-footer { padding: 12px 16px; background: #fafbfb; border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 10px;}
        
        .modal-header.error { color: var(--critical); }
        .modal-header.warning { color: var(--warning); }
        .modal-header .material-icons-outlined { font-size: 40px; margin-bottom: 2px;}

        .btn-modal {
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; border: none;
        }
        .btn-modal.primary { background-color: var(--primary-color); color: white; }
        .btn-modal.primary:hover { background-color: var(--primary-hover); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* RESPONSIVE MÓVIL */
        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: var(--surface); }
            .container { max-width: none; height: 100svh; max-height: none; border-radius: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <!-- CABECERA FIJA Y MINIMALISTA -->
        <header class="card-header">
            <!-- Espaciador Izquierdo -->
            <div class="spacer"></div>
            
            <h1>ESCANEAR NFC</h1>
            
            <!-- Botón Retorno Derecho -->
            <button class="icon-btn" title="Volver atrás" onclick="window.history.back();">
                <span class="material-icons-outlined">close</span>
            </button>
        </header>

        <!-- ZONA DE OPCIONES (SCROLLABLE) -->
        <section class="planes-section">

            <div class="card-membresia creditos" onclick="window.location.href='CanjearMembresia.html'">
                <div class="img-container">
                    <span class="material-icons-outlined material-icon-big">card_membership</span>
                </div>
                
                <div class="info-container">
                    <h2>CANJEAR MEMBRESÍA</h2>
                    <p>Usa los créditos de tu plan.</p>
                </div>

                <span class="material-icons-outlined chevron-icon">chevron_right</span>
            </div>

            <div class="card-membresia ecopoints" onclick="window.location.href='CanjearEcoPoints.html'">
                <div class="img-container">
                    <span class="material-icons-outlined material-icon-big">eco</span>
                </div>

                <div class="info-container">
                    <h2>CANJEAR ECOPOINTS</h2>
                    <p>Usa tus puntos ecológicos.</p>
                </div>

                <span class="material-icons-outlined chevron-icon">chevron_right</span>
            </div>

        </section>

        <!-- PIE DE PÁGINA ESTÁTICO -->
        <footer class="card-footer">
            <img src="Imagenes/ECFM.png" alt="Logo de MEF Engineering" class="logo" onerror="this.style.display='none'">
        </footer>

    </main>

    <!-- ==========================================
         MODALES DE SISTEMA Y ALERTAS PRO
         ========================================== -->
    
    <!-- Modal Alerta (Errores) -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header error" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">gpp_bad</span>
                <span id="alerta-titulo">Atención</span>
            </div>
            <div class="modal-body" id="alerta-mensaje">Mensaje de error aquí.</div>
            <div class="modal-footer">
                <button class="btn-modal primary" onclick="cerrarModalAlerta()">Entendido</button>
            </div>
        </div>
    </div>

<script>
    'use strict';

    // ==========================================
    // 1. SISTEMA VISUAL DE MODALES
    // ==========================================
    function mostrarAlerta(titulo, mensaje, tipo = 'error') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header'; 
        if(tipo === 'error') {
            header.classList.add('error'); icon.innerText = 'gpp_bad';
        } else if (tipo === 'warning') {
            header.classList.add('warning'); icon.innerText = 'warning';
        }

        modal.style.display = 'flex';
    }

    function cerrarModalAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
    }

    // ==========================================
    // 2. GESTIÓN DE SESIÓN Y SEGURIDAD
    // ==========================================
    function cerrarSesion() {
        sessionStorage.clear();
        localStorage.setItem("sesionActiva", "no");
        window.location.replace("index.html");
    }

    function validarSesion() {
        if (sessionStorage.getItem("sesionActiva") !== "true") {
            cerrarSesion();
        }
    }

    window.addEventListener("DOMContentLoaded", validarSesion);
    window.addEventListener("pageshow", validarSesion);

    // Control estricto de inactividad a 1 minuto
    let timerInactividad;
    const reiniciarTemporizador = () => {
        clearTimeout(timerInactividad);
        timerInactividad = setTimeout(() => {
            alert("⏰ TIEMPO DE INACTIVIDAD EXCEDIDO. SESIÓN CERRADA.");
            cerrarSesion();
        }, 1 * 60 * 1000); 
    };

    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(evento => {
        document.addEventListener(evento, reiniciarTemporizador, { passive: true });
    });
    reiniciarTemporizador();

    // Bloqueo Anti-Inspección
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
        }
    });

</script>

</body>
</html>
