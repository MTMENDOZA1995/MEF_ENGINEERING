<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIPOS DE MEMBRESÍA | MEF Engineering & Soluciones</title>

    <!-- FUENTES E ICONOS DE GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO MEF ENGINEERING (COMPACTO)
           ========================================== */
        :root {
            --primary-color: #1d3b20;
            --primary-hover: #0a1f0d;
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-dark: #202223;
            --text-subdued: #6d7175;
            --border: #c9cccf;
            --interactive: #2c6ecb;
            --critical: #d82c0d;
            --warning: #b98900;
            --success: #108043;
            --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* LAYOUT FIJO */
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            height: 100svh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* =====================================================
           CONTENEDOR GLOBAL (TARJETA FIJA Y REDUCIDA)
        ===================================================== */
        .container {
            width: 100%;
            max-width: 380px; /* Reducido para fijar el tamaño */
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 750px;
        }

        /* =====================================================
           ENCABEZADO FIJO Y MINIMALISTA
        ===================================================== */
        .card-header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        .card-header .spacer {
            width: 28px; /* Espaciador invisible para centrar el título */
        }

        .card-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            text-align: center;
            flex-grow: 1;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: none;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .icon-btn .material-icons-outlined { font-size: 20px; }

        /* =====================================================
           CONTENEDOR DE PLANES (SCROLL INTERNO)
        ===================================================== */
        .planes-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 16px;
            overflow-y: auto; /* Permite scroll interno de las tarjetas */
            flex-grow: 1;
            background-color: var(--bg-color);
        }
        .planes-section::-webkit-scrollbar { width: 0px; background: transparent; }

        /* =====================================================
           DISEÑO ATRACTIVO DE TARJETAS DE MEMBRESÍA
        ===================================================== */
        .card-membresia {
            background: var(--surface);
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .card-membresia:hover {
            box-shadow: 0 8px 16px rgba(29, 59, 32, 0.12);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .card-membresia:active { transform: scale(0.98); }

        /* Borde decorativo lateral */
        .card-membresia::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--border);
            transition: all 0.2s ease;
        }
        .card-membresia:hover::before { background: var(--primary-color); }

        /* Contenedor de la Imagen/Icono */
        .img-container {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            background-color: #f8fafc; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin-left: 6px; /* Deja espacio para el borde lateral */
        }

        .servicio-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .card-membresia:hover .servicio-img { transform: scale(1.1); }

        /* Textos y Precios */
        .info-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        .card-membresia h2 {
            font-size: 14px;
            margin: 0 0 2px 0;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-membresia p {
            font-size: 11px;
            margin: 0 0 8px 0;
            color: var(--text-subdued);
            line-height: 1.2;
        }

        .precio {
            font-size: 13px;
            font-weight: 800;
            color: var(--success);
            background: #e8f5e9;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            align-self: flex-start;
            border: 1px solid #c8e6c9;
        }

        /* ETIQUETAS (BADGES) VIP / RECOMENDADO */
        .recomendado {
            border-color: #4caf50;
            background: linear-gradient(to right, #ffffff, #f4fbf4);
        }
        .recomendado::before { background: #4caf50; }
        .recomendado:hover { border-color: #4caf50; }

        .vip {
            border-color: #fbc02d;
            background: linear-gradient(to right, #ffffff, #fffdf2);
        }
        .vip::before { background: #fbc02d; }
        .vip:hover { border-color: #fbc02d; }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 9px;
            padding: 4px 10px;
            border-bottom-left-radius: 8px;
            background: #4caf50;
            color: white;
            font-weight: 800;
            letter-spacing: 0.5px;
            z-index: 2;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.05);
        }

        .vip-badge {
            background: #fbc02d;
            color: #423000;
        }

        .icon-ir {
            color: var(--border);
            transition: all 0.2s;
        }
        .card-membresia:hover .icon-ir {
            color: var(--primary-color);
            transform: translateX(3px);
        }

        /* =====================================================
           PIE DE PÁGINA (ESTÁTICO Y REDUCIDO)
        ===================================================== */
        .card-footer {
            background-color: var(--surface);
            text-align: center;
            padding: 12px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-footer .logo { 
            height: 25px; 
            width: auto; 
            display: block; 
            opacity: 0.8;
            pointer-events: none; /* Inhabilita clics e interacciones */
        }

        /* =====================================================
           RESPONSIVE MÓVIL (PANTALLA COMPLETA)
        ===================================================== */
        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: var(--bg-color); }
            .container {
                max-width: none;
                height: 100svh;
                max-height: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <!-- CABECERA FIJA Y MINIMALISTA -->
        <header class="card-header">
            <!-- Espaciador Izquierdo -->
            <div class="spacer"></div>
            
            <h1>TIPOS DE MEMBRESÍA</h1>
            
            <!-- Botón de Retorno a la Derecha -->
            <button class="icon-btn" title="Volver atrás" onclick="window.history.back();">
                <span class="material-icons-outlined">close</span>
            </button>
        </header>

        <!-- ZONA DE TARJETAS DE MEMBRESÍA (SCROLLABLE) -->
        <section class="planes-section">

            <div class="card-membresia" onclick="comprar('basico')">
                <div class="img-container">
                    <img src="Iconos/ECOBASICO.png" alt="Básico" class="servicio-img" onerror="this.style.display='none'">
                </div>
                
                <div class="info-container">
                    <h2>🌱 ECO BÁSICO</h2>
                    <p>Empieza tu experiencia ecológica</p>
                    <div class="precio">S/ 15.00</div>
                </div>
                <span class="material-icons-outlined icon-ir">chevron_right</span>
            </div>

            <div class="card-membresia recomendado" onclick="comprar('aventura')">
                <div class="badge">⭐ RECOMENDADO</div>
                
                <div class="img-container">
                    <img src="Iconos/ECOAVENTURA.png" alt="Aventura" class="servicio-img" onerror="this.style.display='none'">
                </div>

                <div class="info-container">
                    <h2 style="color: #2e7d32;">🌿 ECO AVENTURA</h2>
                    <p>Más beneficios y recompensas</p>
                    <div class="precio">S/ 25.00</div>
                </div>
                <span class="material-icons-outlined icon-ir">chevron_right</span>
            </div>

            <div class="card-membresia vip" onclick="comprar('elite')">
                <div class="badge vip-badge">👑 VIP</div>
                
                <div class="img-container">
                    <img src="Iconos/ECOELITE.png" alt="Elite" class="servicio-img" onerror="this.style.display='none'">
                </div>

                <div class="info-container">
                    <h2 style="color: #d49a00;">🌳 ECO ELITE</h2>
                    <p>Experiencia exclusiva y beneficios VIP</p>
                    <div class="precio">S/ 50.00</div>
                </div>
                <span class="material-icons-outlined icon-ir">chevron_right</span>
            </div>

        </section>

        <!-- PIE DE PÁGINA ESTÁTICO -->
        <footer class="card-footer">
            <img src="Imagenes/ECFM.png" alt="Logo de MEF Engineering" class="logo" onerror="this.style.display='none'">
        </footer>

    </main>

<script>
    'use strict';

    // ==========================================
    // 1. GESTIÓN DE SESIÓN Y SEGURIDAD
    // ==========================================
    function cerrarSesion() {
        sessionStorage.clear();
        localStorage.setItem("sesionActiva", "no");
        window.location.replace("index.html");
    }

    function validarSesion() {
        if (sessionStorage.getItem("sesionActiva") !== "true") {
            cerrarSesion();
        }
    }

    window.addEventListener("DOMContentLoaded", validarSesion);
    window.addEventListener("pageshow", validarSesion);

    // Control estricto de inactividad (1 minuto)
    let timerInactividad;
    const reiniciarTemporizador = () => {
        clearTimeout(timerInactividad);
        timerInactividad = setTimeout(() => {
            alert("⏰ TIEMPO DE INACTIVIDAD EXCEDIDO. SESIÓN CERRADA.");
            cerrarSesion();
        }, 1 * 60 * 1000); 
    };

    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(evt => {
        document.addEventListener(evt, reiniciarTemporizador, { passive: true });
    });
    reiniciarTemporizador();

    // Bloqueo Anti-Inspección
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
        }
    });

    // ==========================================
    // 2. FUNCIÓN DE COMPRA (REDIRECCIÓN)
    // ==========================================
    function comprar(tipo) {
        // Redirige al usuario llevando el nombre del plan en la URL (Query Params)
        window.location.href = `ValidarCompraMembresia.html?plan=${tipo}`;
    }

</script>

</body>
</html>
