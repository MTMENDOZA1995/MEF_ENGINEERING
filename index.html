<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INICIAR SESIÓN | Innovación Sostenible & Atractiva</title>
    
    <!-- FUENTES E ICONOS DE GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO CORPORATIVO
           ========================================== */
        :root {
            --primary-color: #1d3b20;
            --primary-hover: #142d17;
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-dark: #202223;
            --text-subdued: #6d7175;
            --border: #c9cccf;
            --interactive: #2c6ecb;
            --critical: #d82c0d;
            --warning: #b98900;
            --shadow-card: 0 10px 25px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* LAYOUT FIJO BLOQUEADO */
        body {
            background-color: var(--bg-color); color: var(--text-dark);
            height: 100vh; height: 100svh; display: flex; justify-content: center; align-items: center;
            padding: 20px; overflow: hidden; 
        }

        /* =====================================================
           TARJETA DE LOGIN
        ===================================================== */
        .login-card {
            width: 100%; max-width: 420px; 
            background-color: var(--surface); border-radius: var(--radius);
            box-shadow: var(--shadow-card); border: 1px solid var(--border); overflow: hidden;
            display: flex; flex-direction: column;
        }

        .card-header {
            background-color: var(--primary-color); color: #ffffff; padding: 24px; text-align: center;
        }

        .card-header h1 { 
            font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; margin: 0; text-transform: uppercase; 
        }

        .card-body { padding: 40px 30px; display: flex; flex-direction: column; gap: 24px; }

        .logo-box { display: flex; justify-content: center; margin-bottom: 5px; }
        .logo-box img { width: 150px; height: auto; object-fit: contain; transition: transform 0.3s ease; }
        .logo-box img:hover { transform: scale(1.05); }

        /* =====================================================
           FORMULARIO Y CAMPOS (CORRECCIÓN DE ESPACIADO)
        ===================================================== */
        /* Agregamos Flexbox al formulario para separar los bloques uniformemente */
        form {
            display: flex;
            flex-direction: column;
            gap: 22px; /* <-- Esta es la magia que separa Usuario, Contraseña y Botón */
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        
        .form-group label { 
            font-size: 13px; font-weight: 800; color: var(--primary-color); 
            text-transform: uppercase; letter-spacing: 0.5px; margin-left: 2px;
        }

        .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }

        .prefix-icon { position: absolute; left: 16px; color: var(--text-subdued); font-size: 22px; transition: color 0.3s; }

        .form-input {
            width: 100%; padding: 16px 16px 16px 48px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 15px; color: var(--text-dark); background-color: var(--bg-color); transition: all 0.3s ease;
            outline: none; letter-spacing: 0.5px;
        }

        .form-input:focus { 
            background-color: var(--surface); border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px rgba(29, 59, 32, 0.15); 
        }
        .form-input:focus + .prefix-icon, .input-wrapper:focus-within .prefix-icon { color: var(--primary-color); }

        /* OJITO DE CONTRASEÑA */
        .toggle-password {
            position: absolute; right: 16px; cursor: pointer; color: var(--text-subdued);
            display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%; transition: all 0.2s ease;
        }
        .toggle-password:hover { color: var(--text-dark); background-color: #e2e8f0; }
        .input-password-field { padding-right: 55px; }

        /* BOTÓN SUBMIT */
        .login-btn {
            margin-top: 5px; width: 100%; background-color: var(--primary-color); color: #fff; padding: 18px;
            font-size: 15px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1px;
            text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(29, 59, 32, 0.2);
        }

        .login-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(29, 59, 32, 0.3); }
        .login-btn:active { transform: translateY(0); }

        /* PIE DE PÁGINA */
        .card-footer { background-color: #fafafa; text-align: center; padding: 18px; border-top: 1px solid #eaeaea; }
        .card-footer p { font-size: 12px; color: var(--text-subdued); font-weight: 600; margin: 0; letter-spacing: 0.5px; }

        /* MODALES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards; padding: 20px;
        }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 350px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards; text-align: center;
        }
        .modal-header { padding: 24px 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 18px; font-weight: 700;}
        .modal-body { padding: 0 24px 20px; color: var(--text-subdued); font-size: 14px; line-height: 1.5; white-space: pre-wrap;}
        .modal-footer { padding: 16px 20px; background: #fafbfb; border-top: 1px solid var(--border); display: flex; justify-content: center;}
        
        .modal-header.error { color: var(--critical); }
        .modal-header.warning { color: var(--warning); }
        .modal-header .material-icons-outlined { font-size: 48px; margin-bottom: 5px;}

        .btn-modal { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-modal:hover { background-color: var(--primary-hover); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* RESPONSIVE MÓVIL */
        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: var(--surface); }
            .login-card { max-width: none; height: 100svh; border-radius: 0; border: none; box-shadow: none; justify-content: space-between;}
            .card-body { flex-grow: 1; justify-content: center; }
            .card-footer { padding-bottom: 25px; }
        }
    </style>
</head>
<body>

    <main class="login-card">
        <header class="card-header">
            <h1>ACCESO AL SISTEMA</h1>
        </header>

        <section class="card-body">
            <div class="logo-box">
                <img src="Imagenes/ECFM.png" alt="Logo M.E.F- ENGINEERING & HSSE SOLUTIONS" onerror="this.style.display='none'" />
            </div>

            <form id="loginForm" autocomplete="off" novalidate>
                <div class="form-group">
                    <label for="usuario">Usuario (ID)</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined prefix-icon">person</span>
                        <input type="text" id="usuario" name="usuario" class="form-input" placeholder="INGRESE SU ID" required oninput="this.value = this.value.toUpperCase()" autofocus />
                    </div>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="material-icons-outlined prefix-icon">lock</span>
                        <input type="password" id="contrasena" name="contrasena" class="form-input input-password-field" placeholder="INGRESE SU CLAVE" required />
                        <span class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">
                            <span class="material-icons-outlined" id="eyeIcon">visibility</span>
                        </span>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    INGRESAR AL SISTEMA
                    <span class="material-icons-outlined"></span>
                </button>
            </form>
        </section>

        <footer class="card-footer">
            <p>&copy; 2026 M.E.F- ENGINEERING & HSSE SOLUTIONS</p>
        </footer>
    </main>

    <!-- MODAL DE ALERTAS PRO -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">error</span>
                <span id="alerta-titulo">Atención</span>
            </div>
            <div class="modal-body" id="alerta-mensaje"></div>
            <div class="modal-footer">
                <button class="btn-modal" onclick="cerrarAlerta()">Entendido</button>
            </div>
        </div>
    </div>

<script>
    'use strict';

    // 1. SISTEMA VISUAL DE ALERTAS
    function mostrarAlerta(titulo, mensaje, tipo = 'error') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header ' + (tipo === 'error' ? 'error' : 'warning'); 
        icon.innerText = tipo === 'error' ? 'gpp_bad' : 'warning';
        modal.style.display = 'flex';
    }

    function cerrarAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
        document.getElementById('contrasena').value = ''; 
        document.getElementById('usuario').focus();
    }

    // 2. INICIALIZACIÓN Y SEGURIDAD BASE
    document.addEventListener("DOMContentLoaded", () => {
        const inputClave = document.getElementById('contrasena');
        const eyeIcon = document.getElementById('eyeIcon');

        // Lógica del ojito de contraseña
        document.getElementById('togglePassword').addEventListener('click', () => {
            const isPassword = inputClave.getAttribute('type') === 'password';
            inputClave.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerText = isPassword ? 'visibility_off' : 'visibility';
        });

        // DESTRUCCIÓN DE SESIÓN PREVIA POR SEGURIDAD
        sessionStorage.clear();
        localStorage.setItem("sesionActiva", "no");

        // Bloqueo Anti-Inspección
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });
    });

    // 3. LÓGICA DE AUTENTICACIÓN (LOGIN MULTISUCURSAL)
    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const usuarioInput = document.getElementById('usuario').value.trim().toUpperCase();
        const claveInput = document.getElementById('contrasena').value.trim();

        if (!usuarioInput || !claveInput) {
            mostrarAlerta("Campos Vacíos", "Por favor, ingrese su ID de Usuario y su Contraseña para continuar.", "warning");
            return;
        }

        const usuariosDB = JSON.parse(localStorage.getItem('usuarios')) || [];

        // LLAVES MAESTRAS INTACTAS (Requerimiento Gerencial)
        const MASTER_ADMIN = "MTMENDOZA";
        const MASTER_PASS = "C8KM1Y0F1I3K1S6H.&#*"; 

        let accesoConcedido = false;
        let rolUsuario = "OPERARIO"; 
        let sedeUsuario = "GLOBAL / NO REGISTRADA";

        // Validación de Gerencia General (Llave Maestra)
        if (usuarioInput === MASTER_ADMIN && claveInput === MASTER_PASS) {
            accesoConcedido = true;
            rolUsuario = "GERENTE GENERAL";
            sedeUsuario = "GLOBAL";
        } else {
            // Validación contra BD Local
            const usuarioEncontrado = usuariosDB.find(u => u.id === usuarioInput);

            if (usuarioEncontrado) {
                if (usuarioEncontrado.estado === 'INACTIVO') {
                    mostrarAlerta("Cuenta Suspendida", "Esta cuenta de usuario ha sido desactivada por el administrador del sistema.", "error");
                    return;
                }

                try {
                    if (atob(usuarioEncontrado.clave) === claveInput) {
                        accesoConcedido = true;
                        rolUsuario = usuarioEncontrado.cargo || "OPERARIO";
                        sedeUsuario = usuarioEncontrado.area || "GLOBAL / NO REGISTRADA"; 
                    }
                } catch (e) {
                    console.error("Error de desencriptación.");
                }
            }
        }

        // PROCESAR INGRESO O DENEGACIÓN
        if (accesoConcedido) {
            sessionStorage.setItem("sesionActiva", "true");
            sessionStorage.setItem("usuarioLogueado", usuarioInput);
            sessionStorage.setItem("rolUsuario", rolUsuario);
            sessionStorage.setItem("usuarioSede", sedeUsuario); 
            sessionStorage.setItem("menuUsuario", "Botones.html");

            window.location.replace("Botones.html");
        } else {
            mostrarAlerta("Acceso Denegado", "El ID de Usuario o la Contraseña son incorrectos.\n\nVerifique sus credenciales e intente nuevamente.", "error");
        }
    });
</script>

</body>
</html>
