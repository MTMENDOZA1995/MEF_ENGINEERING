<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEMBRESÍAS | MEF Engineering & Soluciones</title>
    
    <!-- FUENTES E ICONOS DE GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO MEF ENGINEERING (COMPACTO)
           ========================================== */
        :root {
            --primary-color: #1d3b20;
            --primary-hover: #0a1f0d;
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-dark: #202223;
            --text-subdued: #6d7175;
            --border: #c9cccf;
            --interactive: #2c6ecb;
            --critical: #d82c0d;
            --warning: #b98900;
            --success: #108043;
            --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* LAYOUT FIJO: El body no hace scroll global */
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            height: 100svh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* =====================================================
           CONTENEDOR GLOBAL (TARJETA FIJA Y REDUCIDA)
        ===================================================== */
        .container {
            width: 100%;
            max-width: 380px; /* Reducido para fijar el tamaño */
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           ENCABEZADO FIJO (SOLO RETORNO A LA DERECHA)
        ===================================================== */
        .card-header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        .card-header .spacer {
            width: 32px; /* Mantiene el título centrado */
        }

        .card-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            text-align: center;
            flex-grow: 1;
            text-transform: uppercase;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: none;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .icon-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: scale(1.05); 
        }

        .icon-btn .material-icons-outlined {
            font-size: 20px;
        }

        /* =====================================================
           BOTONES DE NAVEGACIÓN (COMPACTOS)
        ===================================================== */
        .menu-buttons {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: var(--surface);
        }

        .action-btn {
            width: 100%;
            padding: 16px 14px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: var(--surface);
            border: none;
            box-shadow: 0 4px 10px rgba(29, 59, 32, 0.15);
        }
        
        .action-btn .material-icons-outlined { font-size: 22px; }

        .action-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(29, 59, 32, 0.25);
        }

        .action-btn:active { transform: translateY(0); }

        /* =====================================================
           PIE DE PÁGINA (ESTÁTICO Y REDUCIDO)
        ===================================================== */
        .card-footer {
            background-color: var(--bg-color);
            text-align: center;
            padding: 12px;
            border-top: 1px solid var(--border);
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-footer .logo { 
            height: 25px;
            width: auto; 
            display: block; 
            opacity: 0.8;
            pointer-events: none;
        }

        /* =====================================================
           SISTEMA DE MODALES Y ALERTAS PRO
        ===================================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards;
            padding: 15px;
        }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 320px; border-radius: var(--radius); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards; text-align: center;
        }
        .modal-header { padding: 20px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; font-weight: 700;}
        .modal-body { padding: 0 16px 16px; color: var(--text-subdued); font-size: 13px; line-height: 1.4; }
        .modal-footer { padding: 12px 16px; background: #fafbfb; border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 10px;}
        
        .modal-header.error { color: var(--critical); }
        .modal-header.secure { color: var(--primary-color); }
        .modal-header .material-icons-outlined { font-size: 40px; margin-bottom: 2px;}

        /* Contenedor del Input de la Clave con Ojo */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .form-input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            letter-spacing: 2px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.3s;
            font-family: monospace;
        }
        .form-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(29, 59, 32, 0.15); }

        /* OJITO DE CONTRASEÑA */
        .toggle-password {
            position: absolute;
            right: 8px;
            cursor: pointer;
            color: var(--text-subdued);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .toggle-password:hover { color: var(--text-dark); background-color: #f0f2f4; }
        .toggle-password .material-icons-outlined { font-size: 18px; }

        .btn-modal {
            padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; border: none;
        }
        .btn-modal.primary { background-color: var(--primary-color); color: white; }
        .btn-modal.primary:hover { background-color: var(--primary-hover); }
        .btn-modal.blue { background-color: var(--interactive); color: white; }
        .btn-modal.blue:hover { background-color: #1f57a4; }
        .btn-modal.outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-dark); }
        .btn-modal.outline:hover { background-color: var(--bg-color); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* RESPONSIVE MÓVIL */
        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: var(--surface); }
            .container { max-width: none; height: 100svh; border-radius: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <!-- CABECERA FIJA Y MINIMALISTA -->
        <header class="card-header">
            <div class="spacer"></div>
            
            <h1>MEMBRESÍAS</h1>
            
            <button class="icon-btn" title="Cerrar y Volver" onclick="volverAlMenu(event)">
                <span class="material-icons-outlined">close</span>
            </button>
        </header>

        <section class="menu-buttons">
            <button class="action-btn" onclick="window.location.href='TiposMembresia.html'">
                <span class="material-icons-outlined">workspace_premium</span>
                Comprar Membresía
            </button>
            
            <button class="action-btn" onclick="abrirModalPassword()">
                <span class="material-icons-outlined">block</span>
                Cancelar Membresía
            </button>
        </section>

        <!-- PIE DE PÁGINA ESTÁTICO -->
        <footer class="card-footer">
            <img src="Imagenes/ECFM.png" alt="Logo de MEF Engineering" class="logo" onerror="this.style.display='none'" />
        </footer>

    </main>

    <!-- ==========================================
         MODALES DE SISTEMA Y SEGURIDAD
         ========================================== -->
    
    <!-- Modal Alerta (Errores) -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header error" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">gpp_bad</span>
                <span id="alerta-titulo">Acceso Denegado</span>
            </div>
            <div class="modal-body" id="alerta-mensaje">La contraseña ingresada es incorrecta.</div>
            <div class="modal-footer">
                <button class="btn-modal primary" onclick="cerrarModalAlerta()">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Modal Petición de Clave Segura -->
    <div id="modal-password" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header secure">
                <span class="material-icons-outlined">admin_panel_settings</span>
                <span>Acceso Restringido</span>
            </div>
            <div class="modal-body">
                <p>Ingrese la clave de administrador para cancelar membresías.</p>
                
                <form id="form-password" onsubmit="verificarPassword(event)">
                    <div class="input-wrapper">
                        <input type="password" id="input-clave" class="form-input" placeholder="••••••••" required autocomplete="off">
                        <!-- Ojito de Contraseña -->
                        <span class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">
                            <span class="material-icons-outlined" id="eyeIcon">visibility</span>
                        </span>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-modal outline" onclick="cerrarModalPassword()">Cancelar</button>
                <button class="btn-modal blue" onclick="document.getElementById('form-password').requestSubmit()">Autorizar</button>
            </div>
        </div>
    </div>

<script>
    'use strict';

    // ==========================================
    // 1. SISTEMA VISUAL DE MODALES
    // ==========================================
    function mostrarAlerta(titulo, mensaje, tipo = 'error') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header'; 
        if(tipo === 'error') {
            header.classList.add('error'); icon.innerText = 'gpp_bad';
        }

        modal.style.display = 'flex';
    }

    function cerrarModalAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
        const inputClave = document.getElementById('input-clave');
        if(document.getElementById('modal-password').style.display === 'flex') {
            inputClave.value = '';
            inputClave.focus();
        }
    }

    function abrirModalPassword() {
        document.getElementById('input-clave').value = '';
        
        // Resetear ojito al abrir
        const inputClave = document.getElementById('input-clave');
        const eyeIcon = document.getElementById('eyeIcon');
        inputClave.setAttribute('type', 'password');
        eyeIcon.innerText = 'visibility';

        document.getElementById('modal-password').style.display = 'flex';
        setTimeout(() => document.getElementById('input-clave').focus(), 100);
    }

    function cerrarModalPassword() {
        document.getElementById('modal-password').style.display = 'none';
    }

    // LÓGICA DEL OJITO
    document.getElementById('togglePassword').addEventListener('click', function () {
        const inputClave = document.getElementById('input-clave');
        const eyeIcon = document.getElementById('eyeIcon');
        const isPassword = inputClave.getAttribute('type') === 'password';
        
        inputClave.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.innerText = isPassword ? 'visibility_off' : 'visibility';
    });

    // ==========================================
    // 2. VERIFICACIÓN DE CONTRASEÑA DE GERENCIA
    // ==========================================
    function verificarPassword(e) {
        if (e) e.preventDefault();
        
        const claveIngresada = document.getElementById('input-clave').value.trim();
        const PASSWORD_AUTORIZADA = "C8KM1Y0F1I3K1S6H"; // Clave maestra original
        
        if (claveIngresada === "") return;

        if (claveIngresada === PASSWORD_AUTORIZADA) {
            window.location.href = 'CancelarMembresia.html';
        } else {
            mostrarAlerta("Contraseña Incorrecta", "La clave ingresada no es válida para realizar esta acción.", "error");
        }
    }

    // ==========================================
    // 3. GESTIÓN DE SESIÓN Y NAVEGACIÓN
    // ==========================================
    function cerrarSesion(e) {
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        sessionStorage.clear();
        localStorage.setItem("sesionActiva", "no");
        window.location.replace("index.html");
    }

    function validarSesion() {
        if (sessionStorage.getItem("sesionActiva") !== "true") {
            cerrarSesion();
        }
    }

    function volverAlMenu(e) {
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        window.location.href = sessionStorage.getItem("menuUsuario") || "Botones.html";
    }

    window.addEventListener("DOMContentLoaded", validarSesion);
    window.addEventListener("pageshow", validarSesion);

    // Límite estricto de inactividad (1 minuto)
    let timerInactividad;
    const reiniciarTemporizador = () => {
        clearTimeout(timerInactividad);
        timerInactividad = setTimeout(() => {
            alert("⏰ INACTIVIDAD DETECTADA. SESIÓN CERRADA.");
            cerrarSesion();
        }, 1 * 60 * 1000); 
    };

    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(evt => {
        document.addEventListener(evt, reiniciarTemporizador, { passive: true });
    });
    reiniciarTemporizador();

    // Bloqueo Anti-Inspección
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
        }
    });

</script>

</body>
</html>
