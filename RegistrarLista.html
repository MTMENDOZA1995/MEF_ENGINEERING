<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REGISTRAR ASISTENCIA | MEF Engineering & Soluciones</title>
    
    <!-- FUENTES E ICONOS DE GOOGLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        /* ==========================================
           SISTEMA DE DISEÑO MEF ENGINEERING (COMPACTO)
           ========================================== */
        :root {
            --primary-color: #1d3b20;
            --primary-hover: #0a1f0d;
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-dark: #202223;
            --text-subdued: #6d7175;
            --border: #c9cccf;
            --interactive: #2c6ecb;
            --critical: #d82c0d;
            --warning: #b98900;
            --success: #108043;
            --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 
           LAYOUT FIJO: El body no hace scroll global. 
        */
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            height: 100svh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* =====================================================
           CONTENEDOR GLOBAL (TARJETA KIOSKO)
        ===================================================== */
        .container {
            width: 100%;
            max-width: 450px; /* Tamaño compacto para Kiosko */
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 850px;
        }

        /* =====================================================
           ENCABEZADO (SOLO X A LA DERECHA)
        ===================================================== */
        .card-header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        .card-header .spacer {
            width: 32px; /* Mantiene el título centrado */
        }

        .card-header h1 {
            font-size: 0.95rem; /* Fuente reducida */
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            text-align: center;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        #tituloEvento {
            color: #a5d6a7; 
            font-size: 0.85rem;
            display: block;
            margin-top: 2px;
            font-weight: 500;
        }

        .icon-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            border: none;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .icon-btn .material-icons-outlined { font-size: 20px; }

        /* =====================================================
           FORMULARIO Y CAMPOS
        ===================================================== */
        .form {
            flex-grow: 1;
            padding: 20px; 
            overflow-y: auto; /* Scroll interno solo si la pantalla es enana */
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: var(--surface);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .full-width { grid-column: 1 / -1; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px; 
            font-weight: 700;
            color: var(--text-subdued);
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .prefix-icon {
            position: absolute;
            left: 10px;
            color: var(--text-subdued);
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            padding: 8px 10px 8px 32px; 
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px; 
            color: var(--text-dark);
            background-color: var(--surface);
            transition: all 0.2s ease;
            outline: none;
        }

        /* CAMPO PRINCIPAL DE CÓDIGO (LECTOR DE BARRAS) */
        .input-hero {
            padding: 12px 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            border: 2px solid var(--interactive);
            background-color: #f0f8ff;
            color: var(--interactive);
            border-radius: 8px;
        }
        .input-hero:focus {
            border-color: var(--interactive);
            box-shadow: 0 0 0 3px rgba(44, 110, 203, 0.2);
            background-color: var(--surface);
        }

        /* ESTADO READONLY */
        .form-input[readonly] {
            background-color: #f8fafc;
            color: var(--text-subdued);
            border-color: #e2e8f0;
            font-weight: 600;
            cursor: not-allowed;
        }

        /* =====================================================
           BOTÓN SUBMIT
        ===================================================== */
        .submit-btn {
            margin-top: 5px;
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(29, 59, 32, 0.15);
        }

        .submit-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .submit-btn:active { transform: translateY(0); }

        /* =====================================================
           PIE DE PÁGINA (ESTÁTICO Y REDUCIDO)
        ===================================================== */
        .card-footer {
            background-color: var(--bg-color);
            text-align: center;
            padding: 10px; 
            border-top: 1px solid var(--border);
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-footer .logo { 
            height: 25px; 
            width: auto; 
            display: block; 
            opacity: 0.8;
            pointer-events: none; /* Bloquea cualquier clic accidental */
        }

        /* =====================================================
           SISTEMA DE MODALES Y ALERTAS PRO
        ===================================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards;
            padding: 15px;
        }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 320px; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards; text-align: center;
        }
        .modal-header { padding: 20px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 16px; font-weight: 700;}
        .modal-body { padding: 5px 16px 15px; color: var(--text-dark); font-size: 13px; line-height: 1.4; }
        .modal-footer { padding: 12px 16px; background: #fafbfb; border-top: 1px solid var(--border); display: flex; justify-content: center;}
        
        .modal-header.error { color: var(--critical); }
        .modal-header.warning { color: var(--warning); }
        .modal-header.success { color: var(--success); }
        
        .modal-header .material-icons-outlined { font-size: 40px; margin-bottom: 2px;}

        /* Ticket de Recibo en Modal */
        .receipt-box {
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 5px;
            text-align: left;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
        }
        .receipt-row:last-child { border-bottom: none; }
        .receipt-row strong { color: var(--primary-color); text-align: right; }

        .btn-modal {
            background-color: var(--primary-color); color: white; border: none; padding: 10px 16px;
            border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s;
        }
        .btn-modal:hover { background-color: var(--primary-hover); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }

        /* RESPONSIVE MÓVIL (PANTALLA COMPLETA) */
        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: var(--surface); }
            .container { max-width: none; height: 100svh; border-radius: 0; border: none; box-shadow: none; }
            .form-grid { grid-template-columns: 1fr; gap: 10px; } /* Una columna en móvil */
        }
    </style>
</head>
<body>
    
    <main class="container">

        <!-- CABECERA FIJA (SOLO X A LA DERECHA) -->
        <header class="card-header">
            <!-- Espaciador Izquierdo -->
            <div class="spacer"></div>
            
            <div style="text-align: center; flex-grow: 1;">
                <h1>ASISTENCIA</h1>
                <span id="tituloEvento">CARGANDO EVENTO...</span>
            </div>
            
            <!-- Botón Retorno Derecho -->
            <button class="icon-btn" title="Cerrar y Volver" onclick="window.history.back();">
                <span class="material-icons-outlined">close</span>
            </button>
        </header>

        <section class="form">
            <form id="formAsistencia" autocomplete="off" novalidate>
                
                <!-- CAMPO PRINCIPAL KIOSKO -->
                <div class="form-group full-width" style="margin-bottom: 5px;">
                    <label for="codigo" style="text-align: center; color: var(--interactive); font-size: 12px;">ESCANEE O INGRESE EL CÓDIGO ID</label>
                    <input type="text" id="codigo" name="codigo" class="form-input input-hero" placeholder="CÓDIGO ID" required oninput="this.value = this.value.toUpperCase()" autofocus />
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined prefix-icon">badge</span>
                            <input type="text" id="dni" class="form-input" placeholder="Autollenado" readonly tabindex="-1" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cargo">Rol / Cargo</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined prefix-icon">work_outline</span>
                            <input type="text" id="cargo" class="form-input" placeholder="Autollenado" readonly tabindex="-1" />
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="nombres_completos">Apellidos y Nombres</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined prefix-icon">person_outline</span>
                            <input type="text" id="nombres_completos" class="form-input" placeholder="Autollenado" readonly tabindex="-1" />
                        </div>
                        <!-- Campos ocultos para mantener la lógica interna de DB -->
                        <input type="hidden" id="apellidos">
                        <input type="hidden" id="nombres">
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha Actual</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined prefix-icon">calendar_today</span>
                            <input type="date" id="fecha" class="form-input" readonly tabindex="-1" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora Real</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined prefix-icon">schedule</span>
                            <input type="time" id="hora" class="form-input" style="color: var(--interactive); font-weight: 700;" readonly tabindex="-1" />
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span class="material-icons-outlined">how_to_reg</span>
                    MARCAR ASISTENCIA
                </button>
            </form>
        </section>

        <!-- PIE DE PÁGINA ESTÁTICO -->
        <footer class="card-footer">
            <img src="Imagenes/ECFM.png" alt="Logo MEF Engineering" class="logo" onerror="this.style.display='none'">
        </footer>

    </main>

    <!-- ==========================================
         MODALES DE SISTEMA Y ALERTAS PRO
         ========================================== -->
    
    <!-- Modal Alerta (Errores/Warnings) -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">error</span>
                <span id="alerta-titulo">Atención</span>
            </div>
            <div class="modal-body" id="alerta-mensaje">Mensaje de error aquí.</div>
            <div class="modal-footer">
                <button class="btn-modal" onclick="cerrarModalAlerta()">ENTENDIDO</button>
            </div>
        </div>
    </div>

    <!-- Modal Recibo Asistencia (Éxito) -->
    <div id="modal-recibo" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header success">
                <span class="material-icons-outlined">verified</span>
                <span id="recibo-titulo">ENTRADA REGISTRADA</span>
            </div>
            <div class="modal-body">
                <div class="receipt-box" id="recibo-detalles">
                    <!-- Contenido dinámico -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal" onclick="cerrarModalRecibo()">CONTINUAR</button>
            </div>
        </div>
    </div>

<script>
    'use strict';

    // ==========================================
    // 1. SISTEMA VISUAL DE MODALES
    // ==========================================
    function mostrarAlerta(titulo, mensaje, tipo = 'error') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;

        header.className = 'modal-header'; 
        if(tipo === 'error') {
            header.classList.add('error'); icon.innerText = 'gpp_bad';
        } else if (tipo === 'warning') {
            header.classList.add('warning'); icon.innerText = 'warning';
        }

        modal.style.display = 'flex';
    }

    function cerrarModalAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
        document.getElementById('codigo').focus(); 
    }

    function mostrarReciboAsistencia(tipo, nombreCompleto, hora, extraData) {
        const titulo = document.getElementById('recibo-titulo');
        const detalles = document.getElementById('recibo-detalles');
        
        titulo.innerText = tipo === 'ENTRADA' ? 'ENTRADA REGISTRADA' : 'SALIDA REGISTRADA';

        let htmlDetalles = `
            <div class="receipt-row"><span>Trabajador:</span> <strong>${nombreCompleto}</strong></div>
            <div class="receipt-row"><span>Hora de ${tipo.toLowerCase()}:</span> <strong>${hora}</strong></div>
        `;

        if (tipo === 'ENTRADA') {
            if (extraData && extraData.includes('Tardanza')) {
                htmlDetalles += `<div class="receipt-row"><span>Estado:</span> <strong style="color: var(--critical);">${extraData}</strong></div>`;
            } else {
                htmlDetalles += `<div class="receipt-row"><span>Estado:</span> <strong style="color: var(--success);">${extraData}</strong></div>`;
            }
        } else {
            htmlDetalles += `<div class="receipt-row"><span>Tiempo Laborado:</span> <strong>${extraData}</strong></div>`;
        }

        detalles.innerHTML = htmlDetalles;
        document.getElementById('modal-recibo').style.display = 'flex';
    }

    function cerrarModalRecibo() {
        document.getElementById('modal-recibo').style.display = 'none';
        const inputCodigo = document.getElementById('codigo');
        inputCodigo.value = '';
        inputCodigo.focus();
    }


    // ==========================================
    // 2. GESTIÓN DE SESIÓN Y NAVEGACIÓN
    // ==========================================
    function cerrarSesion() {
        sessionStorage.clear();
        localStorage.setItem("sesionActiva", "no");
        window.location.replace("index.html");
    }

    function validarSesion() {
        if (sessionStorage.getItem("sesionActiva") !== "true") {
            cerrarSesion();
        }
    }

    window.addEventListener("DOMContentLoaded", validarSesion);
    window.addEventListener("pageshow", validarSesion);

    let timerInactividad;
    const reiniciarTemporizador = () => {
        clearTimeout(timerInactividad);
        timerInactividad = setTimeout(() => {
            alert("⏰ INACTIVIDAD DETECTADA. SESIÓN CERRADA.");
            cerrarSesion();
        }, 1 * 60 * 1000); 
    };

    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(evt => {
        document.addEventListener(evt, reiniciarTemporizador, { passive: true });
    });
    reiniciarTemporizador();

    // Bloqueo Anti-Inspección
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
        }
    });

    // ==========================================
    // 3. LÓGICA DEL RELOJ EN TIEMPO REAL
    // ==========================================
    const inputFecha = document.getElementById("fecha");
    const inputHora = document.getElementById("hora");

    const actualizarReloj = () => {
        const ahora = new Date();
        const offset = ahora.getTimezoneOffset();
        const fechaLocal = new Date(ahora.getTime() - (offset * 60 * 1000));
        
        inputFecha.value = fechaLocal.toISOString().split("T")[0];
        inputHora.value = fechaLocal.toISOString().split("T")[1].substring(0, 5);
    };

    actualizarReloj();
    setInterval(actualizarReloj, 30000); 

    // ==========================================
    // 4. LÓGICA CORE: ASISTENCIAS (ENTRADAS / SALIDAS CON SEDE OCULTA)
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
        const eventoSeleccionado = JSON.parse(localStorage.getItem("eventoSeleccionado"));

        if (!eventoSeleccionado) {
            alert("⚠️ NO SE HA SELECCIONADO NINGÚN EVENTO VÁLIDO.");
            window.history.back(); 
            return;
        }

        const inputCodigo = document.getElementById("codigo");
        const tituloEvento = document.getElementById("tituloEvento");
        const formAsistencia = document.getElementById("formAsistencia");
        
        tituloEvento.textContent = (eventoSeleccionado.NombreEvento || "EVENTO SIN NOMBRE").toUpperCase();
        
        const fechaProgramada = eventoSeleccionado.FechaEvento;
        const horaProgramada = eventoSeleccionado.HoraEntrante || "08:00";

        // Recuperar Sede de quien Opera el Kiosko (Inyección silenciosa)
        const sedeOperador = sessionStorage.getItem("usuarioSede") || "NO REGISTRADA";

        // --- FUNCIONES DE CÁLCULO ---
        const convertirAHoraEnMinutos = hora => {
            const [h, m] = hora.split(":").map(Number);
            return (h * 60) + (m || 0);
        };

        const convertirMinutosAHoras = minutos => {
            if (minutos <= 0) return "0h 0min";
            const h = Math.floor(minutos / 60);
            const m = minutos % 60;
            return `${h}h ${m}min`;
        };

        const calcularTardanzaReal = (fechaActual, horaActual, fechaProg, horaProg) => {
            if (fechaActual === fechaProg) {
                const entradaMin = convertirAHoraEnMinutos(horaActual);
                const progMin = convertirAHoraEnMinutos(horaProg);
                return Math.max(0, entradaMin - progMin);
            }
            if (new Date(fechaActual) < new Date(fechaProg)) return 0;
            
            const msPorDia = 24 * 60 * 60 * 1000;
            const diasRetraso = Math.floor((new Date(fechaActual) - new Date(fechaProg)) / msPorDia);
            const progMin = convertirAHoraEnMinutos(horaProg);
            const entradaMin = convertirAHoraEnMinutos(horaActual) + (diasRetraso * 1440);
            return Math.max(0, entradaMin - progMin);
        };

        const limpiarCampos = () => {
            ["dni", "apellidos", "nombres", "nombres_completos", "cargo"].forEach(id => {
                document.getElementById(id).value = "";
            });
        };

        // --- AUTOCOMPLETADO DINÁMICO ---
        inputCodigo.addEventListener("blur", () => {
            const codigo = inputCodigo.value.trim().toUpperCase();
            if (!codigo) {
                limpiarCampos();
                return;
            }

            const listaPersonal = JSON.parse(localStorage.getItem("personal")) || [];
            const trabajador = listaPersonal.find(p => p.codigo === codigo);

            if (trabajador) {
                document.getElementById("dni").value = trabajador.dni || '---';
                document.getElementById("apellidos").value = trabajador.apellidos || '';
                document.getElementById("nombres").value = trabajador.nombres || '';
                document.getElementById("nombres_completos").value = `${trabajador.apellidos || ''} ${trabajador.nombres || ''}`.trim();
                
                // Si el personal no tiene cargo, usamos su area/sede o un default
                document.getElementById("cargo").value = trabajador.cargo || 'CLIENTE';
            } else {
                limpiarCampos();
            }
        });

        // --- PROCESAR EL REGISTRO ---
        formAsistencia.addEventListener("submit", function (e) {
            e.preventDefault();
            actualizarReloj();

            const codigo = inputCodigo.value.trim().toUpperCase();
            const fechaActual = inputFecha.value;
            const horaActual = inputHora.value;
            
            if (!codigo) {
                mostrarAlerta("Código Requerido", "Debe escanear o ingresar el ID del trabajador.", "warning");
                return;
            }

            const listaPersonal = JSON.parse(localStorage.getItem("personal")) || [];
            const trabajador = listaPersonal.find(p => p.codigo === codigo);

            if (!trabajador) {
                mostrarAlerta("Personal No Encontrado", `El código [${codigo}] no existe en la base de datos de personal.`, "error");
                this.reset();
                actualizarReloj();
                return;
            }

            const claveStorage = `asistencia_${eventoSeleccionado.NombreEvento}`;
            const asistenciasDelEvento = JSON.parse(localStorage.getItem(claveStorage)) || [];

            const registroExistente = asistenciasDelEvento.find(r => r.codigo === codigo && !r.salida);

            const nombreCompleto = `${trabajador.nombres} ${trabajador.apellidos}`.trim();

            if (registroExistente) {
                // --- FLUJO 1: MARCAR SALIDA ---
                const fechaHoraEntrada = new Date(`${registroExistente.fechaEntrada || registroExistente.fecha}T${registroExistente.entrada}:00`);
                const fechaHoraSalida = new Date(`${fechaActual}T${horaActual}:00`);
                
                let totalMinTrabajados = Math.floor((fechaHoraSalida - fechaHoraEntrada) / 60000);
                if (totalMinTrabajados < 0) totalMinTrabajados = 0;

                registroExistente.fechaSalida = fechaActual;
                registroExistente.salida = horaActual;
                registroExistente.horasTrabajadas = convertirMinutosAHoras(totalMinTrabajados);
                
                mostrarReciboAsistencia('SALIDA', nombreCompleto, horaActual, registroExistente.horasTrabajadas);
            
            } else if (asistenciasDelEvento.some(r => r.codigo === codigo && r.salida)) {
                // --- FLUJO 2: TURNO COMPLETO ---
                mostrarAlerta("Turno Completado", "Este trabajador ya registró su Entrada y Salida para este evento.", "warning");
                this.reset();
                actualizarReloj();
                return;
            
            } else {
                // --- FLUJO 3: MARCAR ENTRADA INICIAL CON INYECCIÓN DE SEDE ---
                const tardanzaMin = calcularTardanzaReal(fechaActual, horaActual, fechaProgramada, horaProgramada);

                asistenciasDelEvento.push({
                    codigo: codigo,
                    dni: trabajador.dni || "S/D",
                    apellidos: trabajador.apellidos || "S/A",
                    nombres: trabajador.nombres || "S/N",
                    cargo: trabajador.cargo || "OPERARIO",
                    sedeKiosko: sedeOperador, // Inyección silenciosa
                    fechaEntrada: fechaActual,
                    fecha: fechaActual, // Fallback
                    entrada: horaActual,
                    fechaSalida: "",
                    salida: "", 
                    tardanza: convertirMinutosAHoras(tardanzaMin),
                    horasTrabajadas: "0h 0min"
                });

                let estadoEntrada = "";
                if (new Date(fechaActual) < new Date(fechaProgramada)) {
                    estadoEntrada = "Llegada anticipada (Día anterior)";
                } else {
                    estadoEntrada = tardanzaMin > 0 ? `Tardanza de ${convertirMinutosAHoras(tardanzaMin)}` : 'Llegó a tiempo';
                }

                mostrarReciboAsistencia('ENTRADA', nombreCompleto, horaActual, estadoEntrada);
            }

            localStorage.setItem(claveStorage, JSON.stringify(asistenciasDelEvento));
            limpiarCampos();
            actualizarReloj();
        });
    });
</script>
